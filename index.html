<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiLector · 每日西语阅读</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F3EE;--primary:#C0392B;--gold:#C8860A;--navy:#1B2A4A;
  --teal:#2E86AB;--text:#1A1A2E;--muted:#6B7280;--border:#E8DDD0;
}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);min-height:100vh;max-width:860px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#1B2A4A,#2C3E6B,#1B2A4A);padding:20px 16px 16px;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:rgba(200,134,10,.13);border-radius:50%}
.hdr-inner{position:relative;z-index:1}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start}
.brand-flag{font-size:24px;margin-bottom:3px}
.brand-title{font-size:22px;font-weight:900;color:#fff;line-height:1.15}
.brand-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;font-weight:600}
.refresh-btn{background:rgba(200,134,10,.2);border:1.5px solid rgba(200,134,10,.5);color:#F1C40F;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.date-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800}
.badge-gold{background:var(--gold);color:#fff}
.badge-ghost{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2)}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);padding:0 14px}
.tab{padding:13px 15px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;font-family:inherit}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.cats{display:flex;gap:7px;padding:11px 14px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:2px solid var(--border);background:var(--bg);color:var(--muted);font-family:inherit;transition:all .2s}
.cat.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.list{padding:14px;display:flex;flex-direction:column;gap:12px}
.acard{background:#fff;border-radius:15px;padding:16px;cursor:pointer;border:2px solid var(--border);transition:all .2s;box-shadow:0 3px 14px rgba(192,57,43,.07)}
.acard:hover{transform:translateY(-2px);border-color:#C0392B55;box-shadow:0 7px 24px rgba(192,57,43,.14)}
.acard-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.ctag{display:inline-block;padding:3px 10px;border-radius:9px;font-size:11px;font-weight:800;color:#fff}
.lvl-tag{font-size:11px;font-weight:800;color:#fff;background:var(--navy);padding:3px 9px;border-radius:8px}
.acard h3{font-size:15px;font-weight:800;line-height:1.35;margin-bottom:3px}
.acard .sub{font-size:12px;color:var(--muted);font-weight:600}
.acard .preview{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reader-hd{background:#fff;padding:14px 15px;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:10}
.back-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--primary);font-size:13px;font-weight:800;cursor:pointer;margin-bottom:9px;font-family:inherit}
.reader-hd h2{font-size:19px;font-weight:900;line-height:1.3}
.reader-hd .sub2{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
.ctrls{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.ctrl{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:2px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;transition:all .2s}
.ctrl.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.hint{font-size:11px;color:var(--muted);text-align:center;padding:8px 14px 2px;font-weight:600}
.sentences{padding:13px;display:flex;flex-direction:column;gap:12px}
.sblock{background:#fff;border-radius:13px;padding:14px;border:2px solid var(--border)}
.snum{font-size:10px;font-weight:900;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.es-text{font-size:15px;font-weight:600;line-height:1.85;color:var(--text);user-select:none;cursor:default}
.word{cursor:pointer;border-radius:3px;padding:0 2px;transition:background .12s;display:inline}
.word:hover{background:#FFF3E0;color:var(--primary)}
.word.pressing{background:#FDEBD0;color:var(--primary)}
.zh-text{font-size:13px;color:var(--teal);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);line-height:1.65;font-weight:600}
.patterns{margin:0 13px 22px;background:linear-gradient(135deg,#EEF2FF,#E0F2FE);border-radius:15px;padding:16px;border:2px solid #C7D2FE}
.pat-title{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:12px}
.pat-item{margin-bottom:15px}
.pat-item:last-child{margin-bottom:0}
.pat-sent{font-size:13px;font-weight:700;color:#1E40AF;background:rgba(255,255,255,.7);padding:8px 12px;border-radius:9px;margin-bottom:7px;border-left:3px solid var(--teal);font-style:italic;line-height:1.55}
.pat-analysis{font-size:12px;color:#374151;line-height:1.78}
.pat-formula{display:inline-block;background:#F7C948;color:#1A1A2E;padding:3px 10px;border-radius:7px;font-size:11px;font-weight:800;margin-top:5px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.popup{background:#fff;width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:20px 18px 34px;animation:slideUp .22s ease-out}
.drag{width:38px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px}
.pop-word{font-size:30px;font-weight:900;color:var(--primary)}
.pop-type{font-size:12px;color:var(--muted);font-weight:700;margin:3px 0 9px}
.pop-meaning{font-size:20px;font-weight:800;margin-bottom:13px}
.pop-ctx{background:var(--bg);border-radius:11px;padding:10px 13px;margin-bottom:7px;border-left:3px solid var(--primary)}
.pop-ctx.alt{border-left-color:var(--teal)}
.pop-ctx-label{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:4px}
.pop-ctx .es{font-size:13px;font-style:italic;font-weight:600;line-height:1.6;color:var(--text)}
.pop-ctx .zh{font-size:12px;color:var(--muted);margin-top:4px}
.pop-acts{display:flex;gap:8px;margin-top:14px}
.add-btn{flex:1;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .2s}
.add-btn:hover{background:#A93226}
.cls-btn{padding:12px 17px;border-radius:12px;border:2px solid var(--border);background:none;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit}
.vocab-wrap{padding:14px}
.vocab-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.vcnt{background:var(--primary);color:#fff;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:800}
.vsearch{width:100%;padding:9px 14px;border-radius:11px;border:2px solid var(--border);font-size:14px;background:#fff;color:var(--text);margin-bottom:12px;outline:none;font-family:inherit;transition:border-color .2s}
.vsearch:focus{border-color:var(--primary)}
.vcard{background:#fff;border-radius:13px;padding:14px;margin-bottom:9px;border:2px solid var(--border);transition:border-color .2s}
.vcard:hover{border-color:#C0392B44}
.vrow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.vword{font-size:21px;font-weight:900;color:var(--primary)}
.vtype{font-size:11px;color:var(--muted);font-weight:700;background:var(--bg);padding:2px 8px;border-radius:7px;margin-top:3px}
.vmeaning{font-size:16px;font-weight:800;margin-bottom:8px}
.vsent{background:var(--bg);border-radius:9px;padding:9px 11px;border-left:3px solid var(--gold)}
.vsent .es{font-size:12px;font-style:italic;line-height:1.55}
.vsent .zh{font-size:12px;color:var(--muted);margin-top:4px}
.vdate{font-size:10px;color:var(--muted);text-align:right;margin-top:6px;font-weight:700}
.vdel{background:none;border:none;color:#EF4444;cursor:pointer;font-size:22px;line-height:1;padding:0 4px;flex-shrink:0}
.empty{text-align:center;padding:55px 18px;color:var(--muted)}
.empty-ico{font-size:50px;margin-bottom:10px}
.empty p{font-size:14px;font-weight:600;line-height:1.7}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1A2E;color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;font-weight:800;z-index:200;white-space:nowrap;display:none;box-shadow:0 7px 26px rgba(0,0,0,.28)}
@keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-inner">
    <div class="hdr-top">
      <div>
        <div class="brand-flag">&#127466;&#127480;</div>
        <div class="brand-title">MiLector Español</div>
        <div class="brand-sub">每日西语精读 · B2-C1 · 离线词典</div>
      </div>
      <button class="refresh-btn" id="refreshBtn">&#128260; 今日更新</button>
    </div>
    <div class="date-strip">
      <span class="badge badge-gold" id="todayDate">&#128197; ...</span>
      <span class="badge badge-ghost">&#127919; B2-C1</span>
      <span class="badge badge-ghost">&#128196; 4篇文章</span>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab on" id="tabRead">&#128218; 阅读</button>
  <button class="tab" id="tabVocab">&#128214; 词库</button>
</div>

<div id="panelRead">
  <div class="cats">
    <button class="cat on" data-cat="all">全部</button>
    <button class="cat" data-cat="story">故事</button>
    <button class="cat" data-cat="science">科普</button>
    <button class="cat" data-cat="news">新闻</button>
    <button class="cat" data-cat="entertainment">娱乐</button>
  </div>
  <div class="list" id="articleList"></div>
  <div id="articleReader" style="display:none"></div>
</div>

<div id="panelVocab" style="display:none">
  <div class="vocab-wrap">
    <div class="vocab-hd">
      <span style="font-weight:800;font-size:16px">我的词库</span>
      <span class="vcnt" id="vocabCount">0 个单词</span>
    </div>
    <input class="vsearch" id="vocabSearch" placeholder="搜索单词或中文...">
    <div id="vocabList"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="drag"></div>
    <div id="popupBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
// 内置离线词典 — 覆盖文章中所有重要词汇
// ══════════════════════════════════════════════
var DICT = {
  // A
  "a":{"type":"介词","zh":"到；给；在","ex":"Voy a Madrid mañana.","exZh":"我明天去马德里。"},
  "abrir":{"type":"动词 tr.","zh":"打开","ex":"Abre la ventana, por favor.","exZh":"请打开窗户。"},
  "adaptación":{"type":"名词 f.","zh":"适应；改编","ex":"La adaptación al nuevo trabajo lleva tiempo.","exZh":"适应新工作需要时间。"},
  "aldeanos":{"type":"名词 m.pl.","zh":"村民们","ex":"Los aldeanos celebraron la fiesta juntos.","exZh":"村民们一起庆祝节日。"},
  "algoritmo":{"type":"名词 m.","zh":"算法","ex":"El algoritmo procesa millones de datos por segundo.","exZh":"该算法每秒处理数百万条数据。"},
  "algoritmos":{"type":"名词 m.pl.","zh":"算法（复数）","ex":"Los algoritmos de IA aprenden solos.","exZh":"人工智能算法可以自主学习。"},
  "altera":{"type":"动词 tr.","zh":"改变；扰乱","ex":"El estrés altera el sueño.","exZh":"压力会影响睡眠。"},
  "ambición":{"type":"名词 f.","zh":"雄心；野心","ex":"Su ambición le llevó al éxito.","exZh":"他的雄心使他走向成功。"},
  "análisis":{"type":"名词 m.","zh":"分析","ex":"El análisis del texto reveló errores.","exZh":"对文本的分析揭示了错误。"},
  "aquella":{"type":"形容词/代词","zh":"那个（远指）","ex":"Aquella casa era muy antigua.","exZh":"那栋房子非常古老。"},
  "arquitectura":{"type":"名词 f.","zh":"建筑；结构","ex":"La arquitectura neuronal es compleja.","exZh":"神经元结构非常复杂。"},
  "asumir":{"type":"动词 tr.","zh":"承担；承认","ex":"Debes asumir tu responsabilidad.","exZh":"你必须承担你的责任。"},
  "atrayendo":{"type":"动词 tr. (gerundio)","zh":"吸引着（现在分词）","ex":"El museo sigue atrayendo visitantes.","exZh":"博物馆继续吸引着游客。"},
  "autobiografías":{"type":"名词 f.pl.","zh":"自传（复数）","ex":"Las autobiografías revelan la vida interior.","exZh":"自传揭示了内心世界。"},
  // B
  "bautizado":{"type":"动词 tr. (participio)","zh":"被命名为；被称为","ex":"El fenómeno fue bautizado como crisis.","exZh":"这一现象被称为危机。"},
  "borradores":{"type":"名词 m.pl.","zh":"草稿（复数）","ex":"Escribió varios borradores antes del final.","exZh":"他在定稿前写了几份草稿。"},
  // C
  "cabe":{"type":"动词 intr.","zh":"有理由；可以（caber第三人称）","ex":"Cabe destacar su esfuerzo.","exZh":"值得指出他的努力。"},
  "cajón":{"type":"名词 m.","zh":"抽屉","ex":"Guarda los documentos en el cajón.","exZh":"把文件放在抽屉里。"},
  "caminar":{"type":"动词 intr.","zh":"行走；步行","ex":"Me gusta caminar por el parque.","exZh":"我喜欢在公园散步。"},
  "capacidad":{"type":"名词 f.","zh":"能力；容量","ex":"Tiene una gran capacidad para aprender.","exZh":"他有很强的学习能力。"},
  "caracteriza":{"type":"动词 tr.","zh":"（使）具有……特点","ex":"La precisión caracteriza su trabajo.","exZh":"精准是他工作的特点。"},
  "cartografiar":{"type":"动词 tr.","zh":"绘制地图；描绘","ex":"Es difícil cartografiar las emociones.","exZh":"情感很难被描绘出来。"},
  "cartógrafo":{"type":"名词 m.","zh":"制图师；绘图员","ex":"El cartógrafo dibujó el mapa del reino.","exZh":"制图师绘制了王国的地图。"},
  "certeza":{"type":"名词 f.","zh":"确信；把握","ex":"Habló con certeza absoluta.","exZh":"他说话时充满了绝对的把握。"},
  "chronic":{"type":"形容词","zh":"慢性的；长期的","ex":"El dolor crónico afecta la calidad de vida.","exZh":"慢性疼痛影响生活质量。"},
  "crónica":{"type":"形容词 f.","zh":"慢性的；长期的","ex":"La privación crónica del sueño es peligrosa.","exZh":"长期睡眠剥夺很危险。"},
  "colapsar":{"type":"动词 tr.","zh":"使崩塌；消弭","ex":"Quería colapsar las barreras entre culturas.","exZh":"他想消弭文化之间的壁垒。"},
  "comete":{"type":"动词 tr.","zh":"犯（错误）","ex":"Todo el mundo comete errores a veces.","exZh":"每个人有时都会犯错误。"},
  "comprensión":{"type":"名词 f.","zh":"理解；理解力","ex":"La comprensión lectora es fundamental.","exZh":"阅读理解能力至关重要。"},
  "comprendió":{"type":"动词 tr. (pret.)","zh":"理解了；明白了","ex":"Finalmente comprendió el problema.","exZh":"他终于理解了这个问题。"},
  "conlleva":{"type":"动词 tr.","zh":"带来；意味着","ex":"El éxito conlleva responsabilidades.","exZh":"成功意味着责任。"},
  "contemporánea":{"type":"形容词 f.","zh":"当代的；现代的","ex":"La literatura contemporánea es muy variada.","exZh":"当代文学非常多样。"},
  "contexto":{"type":"名词 m.","zh":"背景；语境","ex":"Hay que entender el contexto histórico.","exZh":"需要理解历史背景。"},
  "contextualización":{"type":"名词 f.","zh":"背景化；提供背景","ex":"La contextualización es clave en periodismo.","exZh":"在新闻业中，提供背景信息是关键。"},
  "contundencia":{"type":"名词 f.","zh":"力度；说服力","ex":"Argumentó con contundencia.","exZh":"他以充分的力度进行了论证。"},
  "convencido":{"type":"形容词/participio","zh":"确信的；深信的","ex":"Estaba convencido de su inocencia.","exZh":"他确信自己是无辜的。"},
  "corporativa":{"type":"形容词 f.","zh":"企业的；公司的","ex":"La cultura corporativa influye en los empleados.","exZh":"企业文化影响员工。"},
  "críticos":{"type":"名词 m.pl.","zh":"批评家们；评论家们","ex":"Los críticos elogiaron la novela.","exZh":"评论家们称赞了这部小说。"},
  "cultura":{"type":"名词 f.","zh":"文化","ex":"La cultura española es muy rica.","exZh":"西班牙文化非常丰富。"},
  "curiosidad":{"type":"名词 f.","zh":"好奇心","ex":"La curiosidad es la base del aprendizaje.","exZh":"好奇心是学习的基础。"},
  // D
  "debate":{"type":"名词 m.","zh":"辩论；讨论","ex":"El debate fue muy intenso.","exZh":"辩论非常激烈。"},
  "décadas":{"type":"名词 f.pl.","zh":"几十年（复数）","ex":"Han pasado décadas desde entonces.","exZh":"从那时起已经过了几十年。"},
  "descifrar":{"type":"动词 tr.","zh":"解读；破译","ex":"Es difícil descifrar su letra.","exZh":"他的字迹很难辨认。"},
  "deseo":{"type":"名词 m.","zh":"渴望；愿望","ex":"Su mayor deseo es viajar por el mundo.","exZh":"他最大的愿望是环游世界。"},
  "desmantelado":{"type":"动词 tr. (participio)","zh":"打破；拆除","ex":"Han desmantelado el viejo sistema.","exZh":"他们已经打破了旧体制。"},
  "deteriora":{"type":"动词 tr.","zh":"损害；使恶化","ex":"El tabaco deteriora los pulmones.","exZh":"烟草损害肺部。"},
  "devotos":{"type":"名词 m.pl.","zh":"信徒；忠实粉丝","ex":"Los devotos de ese autor llenan las librerías.","exZh":"那位作者的忠实读者挤满了书店。"},
  "disciplina":{"type":"名词 f.","zh":"纪律；自律","ex":"La disciplina es necesaria para el éxito.","exZh":"自律是成功的必要条件。"},
  "disfrazadas":{"type":"形容词 f.pl.","zh":"伪装的；乔装的","ex":"Sus intenciones estaban disfrazadas de bondad.","exZh":"他的意图伪装成了善意。"},
  "distancia":{"type":"名词 f.","zh":"距离","ex":"La distancia entre las dos ciudades es grande.","exZh":"两座城市之间的距离很远。"},
  "Dostoievski":{"type":"名词 propio","zh":"陀思妥耶夫斯基（俄国作家）","ex":"Dostoievski escribió Crimen y castigo.","exZh":"陀思妥耶夫斯基写了《罪与罚》。"},
  "Dublín":{"type":"名词 propio","zh":"都柏林（爱尔兰首都）","ex":"Dublín es la ciudad de James Joyce.","exZh":"都柏林是詹姆斯·乔伊斯的城市。"},
  // E
  "ebro":{"type":"nombre propio","zh":"埃布罗河（西班牙最长河流）","ex":"El Ebro atraviesa Zaragoza.","exZh":"埃布罗河穿过萨拉戈萨。"},
  "empático":{"type":"形容词 m.","zh":"共情的；移情的","ex":"Un liderazgo empático genera confianza.","exZh":"具有共情能力的领导力能建立信任。"},
  "empleadores":{"type":"名词 m.pl.","zh":"雇主们","ex":"Los empleadores buscan trabajadores creativos.","exZh":"雇主们在寻找有创造力的工人。"},
  "errónea":{"type":"形容词 f.","zh":"错误的","ex":"Esa información es completamente errónea.","exZh":"那个信息完全是错误的。"},

function lookupOffline(word, sentence) {
  var w = word.toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e')
    .replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');
  // 直接查
  if (DICT[word.toLowerCase()]) return DICT[word.toLowerCase()];
  // 去掉重音查
  for (var k in DICT) {
    var kn = k.replace(/[áàä]/g,'a').replace(/[éèë]/g,'e')
      .replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');
    if (kn === w) return DICT[k];
  }
  // 词形还原尝试（去掉常见词尾）
  var stems = [
    word.replace(/aron$/,'ar'), word.replace(/ieron$/,'ir'),
    word.replace(/aba$/,'ar'), word.replace(/ía$/,'er'),
    word.replace(/ando$/,'ar'), word.replace(/iendo$/,'er'),
    word.replace(/ado$/,'ar'), word.replace(/ido$/,'ir'),
    word.replace(/ados$/,'ar'), word.replace(/idos$/,'ir'),
    word.replace(/os$/,'o'), word.replace(/as$/,'a'),
    word.replace(/es$/,'e'), word.replace(/s$/,''),
  ];
  for (var i = 0; i < stems.length; i++) {
    if (stems[i] && stems[i] !== word && DICT[stems[i].toLowerCase()]) {
      return DICT[stems[i].toLowerCase()];
    }

// ══════════════════════════════════════════════
// 状态
// ══════════════════════════════════════════════
var vocab = [];
try { vocab = JSON.parse(localStorage.getItem('es_vocab') || '[]'); } catch(e){ vocab = []; }
var currentCat = 'all';
var currentArticle = null;
var showChinese = false;
var pressTimer = null;

// ══════════════════════════════════════════════
// 初始化
// ══════════════════════════════════════════════
(function init(){
  var d = new Date();
  document.getElementById('todayDate').textContent =
    d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
  document.getElementById('tabRead').addEventListener('click', function(){ switchTab('read'); });
  document.getElementById('tabVocab').addEventListener('click', function(){ switchTab('vocab'); });
  document.getElementById('refreshBtn').addEventListener('click', function(){ showToast('今日文章已是最新！'); });
  document.getElementById('overlay').addEventListener('click', function(e){
    if(e.target===document.getElementById('overlay')) closePopup();
  });
  document.getElementById('vocabSearch').addEventListener('input', renderVocab);
  document.querySelectorAll('.cat').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentCat = btn.getAttribute('data-cat');
      document.querySelectorAll('.cat').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      renderList();
    });
  });
  renderList();
  updateVocabBadge();
})();

function switchTab(t){
  document.getElementById('panelRead').style.display = t==='read'?'':'none';
  document.getElementById('panelVocab').style.display = t==='vocab'?'':'none';
  document.getElementById('tabRead').className = 'tab'+(t==='read'?' on':'');
  document.getElementById('tabVocab').className = 'tab'+(t==='vocab'?' on':'');
  if(t==='vocab') renderVocab();
}

function renderList(){
  var list = document.getElementById('articleList');
  var reader = document.getElementById('articleReader');
  reader.style.display='none'; list.style.display=''; list.innerHTML='';
  ARTICLES.filter(function(a){ return currentCat==='all'||a.category===currentCat; })
  .forEach(function(a){
    var card = document.createElement('div');
    card.className='acard';
    card.innerHTML=
      '<div class="acard-meta"><span class="ctag" style="background:'+a.catColor+'">'+a.catLabel+'</span><span class="lvl-tag">'+a.level+'</span></div>'+
      '<h3>'+a.title+'</h3><div class="sub">'+a.subtitle+'</div>'+
      '<div class="preview">'+a.content[0].es+'</div>';
    (function(aid){ card.addEventListener('click', function(){ openArticle(aid); }); })(a.id);
    list.appendChild(card);
  });
}

function openArticle(id){
  for(var i=0;i<ARTICLES.length;i++){ if(ARTICLES[i].id===id){ currentArticle=ARTICLES[i]; break; } }
  if(!currentArticle) return;
  showChinese=false;
  document.getElementById('articleList').style.display='none';
  var reader=document.getElementById('articleReader');
  reader.style.display=''; reader.innerHTML='';

  var hd=document.createElement('div'); hd.className='reader-hd';
  var back=document.createElement('button'); back.className='back-btn';
  back.textContent='← 返回文章列表'; back.addEventListener('click', backToList); hd.appendChild(back);
  var h2=document.createElement('h2'); h2.textContent=currentArticle.title; hd.appendChild(h2);
  var sub2=document.createElement('div'); sub2.className='sub2';
  sub2.textContent=currentArticle.subtitle+'  ['+currentArticle.level+']'; hd.appendChild(sub2);
  var ctrls=document.createElement('div'); ctrls.className='ctrls';
  var zhBtn=document.createElement('button'); zhBtn.className='ctrl'; zhBtn.id='zhToggle';
  zhBtn.textContent='显示中文翻译'; zhBtn.addEventListener('click', toggleChinese);
  ctrls.appendChild(zhBtn); hd.appendChild(ctrls); reader.appendChild(hd);

  var hint=document.createElement('p'); hint.className='hint';
  hint.textContent='长按任意单词 → 查询释义 → 加入词库'; reader.appendChild(hint);

  var sw=document.createElement('div'); sw.className='sentences';
  currentArticle.content.forEach(function(s,i){
    var block=document.createElement('div'); block.className='sblock';
    var num=document.createElement('div'); num.className='snum';
    num.textContent='第 '+(i+1)+' 句'; block.appendChild(num);
    var esDiv=document.createElement('div'); esDiv.className='es-text';
    buildWordSpans(s, esDiv); block.appendChild(esDiv);
    var zhDiv=document.createElement('div'); zhDiv.className='zh-text';
    zhDiv.id='zh_'+s.id; zhDiv.style.display='none'; zhDiv.textContent=s.zh;
    block.appendChild(zhDiv); sw.appendChild(block);
  });
  reader.appendChild(sw);

  var pw=document.createElement('div'); pw.className='patterns';
  var pt=document.createElement('div'); pt.className='pat-title';
  pt.textContent='重点句型 & 语法分析'; pw.appendChild(pt);
  currentArticle.patterns.forEach(function(p){
    var item=document.createElement('div'); item.className='pat-item';
    var ps=document.createElement('div'); ps.className='pat-sent'; ps.textContent=p.sent; item.appendChild(ps);
    var pa=document.createElement('div'); pa.className='pat-analysis'; pa.textContent=p.analysis; item.appendChild(pa);
    var pf=document.createElement('div'); pf.className='pat-formula'; pf.textContent=p.formula; item.appendChild(pf);
    pw.appendChild(item);
  });
  reader.appendChild(pw);
}

function buildWordSpans(sentence, container){
  sentence.es.split(/(\s+)/).forEach(function(tok){
    if(/^\s+$/.test(tok)){ container.appendChild(document.createTextNode(tok)); return; }
    var clean=tok.replace(/[.,!?;:()¡¿«»—]/g,'');
    if(clean.length<2){ container.appendChild(document.createTextNode(tok)); return; }
    var span=document.createElement('span'); span.className='word'; span.textContent=tok;
    var cw=clean.toLowerCase(); var cs=sentence;
    function onStart(){ span.classList.add('pressing'); clearTimeout(pressTimer);
      pressTimer=setTimeout(function(){ span.classList.remove('pressing'); showWordPopup(cw,cs); }, 500); }
    function onEnd(){ clearTimeout(pressTimer); span.classList.remove('pressing'); }
    span.addEventListener('mousedown',onStart); span.addEventListener('mouseup',onEnd);
    span.addEventListener('mouseleave',onEnd); span.addEventListener('touchstart',onStart,{passive:true});
    span.addEventListener('touchend',onEnd); span.addEventListener('touchcancel',onEnd);
    container.appendChild(span);
  });
}

function backToList(){ document.getElementById('articleReader').style.display='none'; document.getElementById('articleList').style.display=''; }

function toggleChinese(){
  showChinese=!showChinese;
  document.querySelectorAll('[id^="zh_"]').forEach(function(el){ el.style.display=showChinese?'':'none'; });
  var btn=document.getElementById('zhToggle');
  if(btn){ btn.textContent=showChinese?'隐藏中文翻译':'显示中文翻译'; btn.className=showChinese?'ctrl on':'ctrl'; }
}

// ══════════════════════════════════════════════
// 弹窗 + 词典查询（完全离线）
// ══════════════════════════════════════════════
function showWordPopup(word, sentence){
  openPopup();
  var entry = lookupOffline(word, sentence);
  var body = document.getElementById('popupBody');

  if(!entry){
    // 未收录词给出基础提示
    body.innerHTML =
      '<div class="pop-word">'+word+'</div>'+
      '<div class="pop-type">西班牙语词汇</div>'+
      '<div class="pop-meaning" style="color:var(--muted);font-size:15px">词典暂未收录此词</div>'+
      '<div class="pop-ctx"><div class="es">'+sentence.es+'</div><div class="zh">'+sentence.zh+'</div></div>'+
      '<div class="pop-acts">'+
        '<button class="add-btn" id="addWordBtn">加入词库（无释义）</button>'+
        '<button class="cls-btn" id="closeBtn">关闭</button>'+
      '</div>';
    document.getElementById('addWordBtn').addEventListener('click', function(){
      doAddToVocab(word,'西班牙语词汇','—',sentence);
    });
    document.getElementById('closeBtn').addEventListener('click', closePopup);
    return;
  }

  body.innerHTML =
    '<div class="pop-word">'+word+'</div>'+
    '<div class="pop-type">'+entry.type+'</div>'+
    '<div class="pop-meaning">'+entry.zh+'</div>'+
    '<div class="pop-ctx">'+
      '<div style="font-size:11px;color:var(--muted);font-weight:800;margin-bottom:4px">出处原句</div>'+
      '<div class="es">'+sentence.es+'</div>'+
      '<div class="zh">'+sentence.zh+'</div>'+
    '</div>'+
    (entry.ex ?
      '<div class="pop-ctx alt">'+
        '<div class="pop-ctx-label">例句</div>'+
        '<div class="es">'+entry.ex+'</div>'+
        '<div class="zh">'+entry.exZh+'</div>'+
      '</div>' : '')+
    '<div class="pop-acts">'+
      '<button class="add-btn" id="addWordBtn">加入词库</button>'+
      '<button class="cls-btn" id="closeBtn">关闭</button>'+
    '</div>';

  var ce=entry; var cw=word; var cs=sentence;
  document.getElementById('addWordBtn').addEventListener('click', function(){
    doAddToVocab(cw, ce.type, ce.zh, cs);
  });
  document.getElementById('closeBtn').addEventListener('click', closePopup);
}

function openPopup(){ document.getElementById('overlay').classList.add('show'); }
function closePopup(){ document.getElementById('overlay').classList.remove('show'); }

function doAddToVocab(word, type, zh, sentence){
  for(var i=0;i<vocab.length;i++){ if(vocab[i].word===word){ showToast('"'+word+'" 已在词库中'); closePopup(); return; } }
  vocab.unshift({ word:word, type:type, chinese:zh,
    sentence:sentence?sentence.es:'', sentenceZh:sentence?sentence.zh:'',
    addedAt:new Date().toLocaleDateString('zh-CN') });
  try{ localStorage.setItem('es_vocab',JSON.stringify(vocab)); }catch(e){}
  updateVocabBadge();
  showToast('"'+word+'" 已加入词库！');
  closePopup();
}

function updateVocabBadge(){
  document.getElementById('tabVocab').textContent = vocab.length>0?'词库 ('+vocab.length+')':'词库';
  var c=document.getElementById('vocabCount'); if(c) c.textContent=vocab.length+' 个单词';
}

function renderVocab(){
  var q=(document.getElementById('vocabSearch').value||'').toLowerCase();
  var c=document.getElementById('vocabCount'); if(c) c.textContent=vocab.length+' 个单词';
  var filtered=vocab.filter(function(v){ return v.word.toLowerCase().indexOf(q)>-1||v.chinese.indexOf(q)>-1; });
  var list=document.getElementById('vocabList');
  if(!filtered.length){
    list.innerHTML='<div class="empty"><div class="empty-ico">'+(vocab.length?'🔍':'📚')+'</div><p>'+(vocab.length?'没有匹配的单词':'词库还是空的<br>去阅读文章，长按单词即可加入词库！')+'</p></div>';
    return;
  }
  list.innerHTML='';
  filtered.forEach(function(v){
    var card=document.createElement('div'); card.className='vcard';
    var sentHtml=v.sentence?'<div class="vsent"><div class="es">'+v.sentence+'</div><div class="zh">'+v.sentenceZh+'</div></div>':'';
    card.innerHTML=
      '<div class="vrow"><div><div class="vword">'+v.word+'</div><div class="vtype">'+v.type+'</div></div><button class="vdel">×</button></div>'+
      '<div class="vmeaning">'+v.chinese+'</div>'+sentHtml+
      '<div class="vdate">加入时间：'+v.addedAt+'</div>';
    var cw=v.word;
    card.querySelector('.vdel').addEventListener('click', function(){ removeVocab(cw); });
    list.appendChild(card);
  });
}

function removeVocab(word){
  vocab=vocab.filter(function(v){ return v.word!==word; });
  try{ localStorage.setItem('es_vocab',JSON.stringify(vocab)); }catch(e){}
  updateVocabBadge(); renderVocab(); showToast('已移除 "'+word+'"');
}

var toastTimer=null;
function showToast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.style.display='none'; },2600);
}
</script>
